<!-- Navigation -->
<app-navbar *ngIf="!isSpecialRoute()"></app-navbar>

<main [ngClass]="{
    'relative flex flex-col min-h-screen': !isSpecialRoute(),
    'main-content-shift': !isSpecialRoute()
}">
    <router-outlet></router-outlet>
</main>



<!-- Footer -->
<app-footer *ngIf="!isSpecialRoute()"></app-footer>

<!-- Floating Assistant -->
<app-floating-wa *ngIf="!isSpecialRoute()"></app-floating-wa>

<!-- Global Toast Notifications Container -->
<aside class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 max-w-md w-full pointer-events-none px-4"
       aria-live="polite"
       aria-atomic="true">
  <div *ngFor="let toast of notifications.toasts()"
       class="pointer-events-auto p-4 border-2 shadow-2xl flex items-start justify-between gap-4 animate-in fade-in slide-in-from-top-4 duration-300"
       [ngClass]="{
         'bg-[#1e0000] border-tomato text-white': toast.type === 'error',
         'bg-[#001e0a] border-emerald text-white': toast.type === 'success',
         'bg-surface-container-high border-secondary text-white': toast.type === 'info'
       }">
    <div class="flex items-start gap-3">
      <span class="material-symbols-outlined text-xl"
            [ngClass]="{
              'text-tomato': toast.type === 'error',
              'text-emerald': toast.type === 'success',
              'text-secondary': toast.type === 'info'
            }">
        {{ toast.type === 'error' ? 'error' : (toast.type === 'success' ? 'check_circle' : 'info') }}
      </span>
      <p class="font-hanken text-xs leading-relaxed font-semibold">{{ toast.message }}</p>
    </div>
    <button (click)="notifications.dismissToast(toast.id)"
            class="text-stark-gray hover:text-white transition-colors"
            aria-label="Cerrar notificación">
      <span class="material-symbols-outlined text-sm">close</span>
    </button>
  </div>
</aside>
