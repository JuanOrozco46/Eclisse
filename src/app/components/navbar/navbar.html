<nav class="fixed top-0 left-0 w-full h-[80px] bg-background/95 backdrop-blur-md border-b border-outline-variant z-50 px-6 md:px-16 flex items-center justify-between overflow-hidden">
    <!-- Texture overlay for premium feel -->
    <div class="absolute inset-0 texture-overlay opacity-10 pointer-events-none"></div>

    <!-- Left: Logo & Quick Anchors -->
    <div class="flex items-center gap-10 h-full relative z-10">
        <a (click)="scrollToSection('top', $event)"
           href="#top"
           class="font-anton text-4xl md:text-5xl text-white no-underline tracking-tighter hover:text-secondary transition-colors cursor-pointer">
           ECLISSE
        </a>
        
        <!-- Desktop Navigation Links (One-Page) -->
        <div class="hidden lg:flex items-center gap-8 h-full">
            <a (click)="scrollToSection('carta', $event)"
               href="#carta"
               class="font-label-caps text-[10px] tracking-widest text-secondary hover:text-white uppercase transition-all flex items-center gap-2 font-bold">
               <span class="w-1.5 h-1.5 bg-secondary rounded-full"></span> LA CARTA
            </a>
            <a (click)="scrollToSection('como-pedir', $event)"
               href="#como-pedir"
               class="font-label-caps text-[10px] tracking-widest text-stark-gray hover:text-secondary uppercase transition-all">
               CÓMO PEDIR
            </a>
            <a *ngIf="photos().show_gallery"
               (click)="scrollToSection('ritual', $event)"
               href="#ritual"
               class="font-label-caps text-[10px] tracking-widest text-stark-gray hover:text-secondary uppercase transition-all">
               EL RITUAL
            </a>
        </div>
    </div>

    <!-- Right: Direct Order / Cart CTA & Staff Access -->
    <div class="flex items-center gap-4 md:gap-6 relative z-10">
        <!-- Direct Cart / Order Button -->
        <button (click)="handleCartOrOrderClick()"
                class="flex items-center gap-3 px-4 md:px-6 py-2.5 font-anton text-xs md:text-sm tracking-widest uppercase transition-all cursor-pointer border-2"
                [ngClass]="data.cartCount() > 0
                  ? 'bg-secondary text-on-secondary border-secondary shadow-brutal-gold hover:bg-white hover:text-black'
                  : 'bg-emerald/10 text-emerald border-emerald hover:bg-emerald hover:text-black'">
            <span class="material-symbols-outlined text-base">
                {{ data.cartCount() > 0 ? 'shopping_cart' : 'local_pizza' }}
            </span>
            <span *ngIf="data.cartCount() === 0">PEDIR AHORA</span>
            <span *ngIf="data.cartCount() > 0">
                TU PEDIDO ({{ data.cartCount() }}) · ${{ data.cartTotal().toLocaleString('es-CO') }}
            </span>
        </button>

        <!-- Staff Access (Desktop) -->
        <a class="hidden md:flex items-center gap-2 font-label-caps text-[9px] text-stark-gray opacity-60 hover:opacity-100 hover:text-secondary border border-outline-variant px-4 py-2 transition-all no-underline" 
           routerLink="/login"
           title="Acceso Equipo">
            <span class="material-symbols-outlined text-sm">person</span>
            EQUIPO
        </a>

        <!-- Mobile Controls -->
        <div class="flex items-center lg:hidden">
            <button class="material-symbols-outlined text-stark-gray hover:text-secondary transition-colors"
                    (click)="toggleMenu()"
                    aria-label="Abrir menú">
                {{ isMenuOpen ? 'close' : 'menu' }}
            </button>
        </div>
    </div>

    <!-- Mobile Menu Overlay -->
    <div *ngIf="isMenuOpen" 
         class="fixed inset-0 top-[80px] bg-background z-40 flex flex-col items-center justify-center space-y-8 animate-in fade-in slide-in-from-top-10 duration-300 lg:hidden p-8">
        <a (click)="scrollToSection('carta', $event)" href="#carta" class="font-anton text-5xl text-secondary hover:text-white transition-colors uppercase tracking-widest no-underline">LA CARTA</a>
        <a (click)="scrollToSection('como-pedir', $event)" href="#como-pedir" class="font-anton text-5xl text-white hover:text-secondary transition-colors uppercase tracking-widest no-underline">CÓMO PEDIR</a>
        <a *ngIf="photos().show_gallery" (click)="scrollToSection('ritual', $event)" href="#ritual" class="font-anton text-5xl text-white hover:text-secondary transition-colors uppercase tracking-widest no-underline">EL RITUAL</a>
        <a (click)="toggleMenu()" class="font-label-caps text-xs text-stark-gray opacity-50 border-t border-outline-variant pt-8 mt-6 uppercase tracking-[0.4em] no-underline" routerLink="/login">ACCESO EQUIPO</a>
    </div>
</nav>
